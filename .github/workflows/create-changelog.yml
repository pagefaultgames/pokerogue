name: Create Changelog
on:
  pull_request:
    branches:
      - main

jobs:
  Create-changelog:
    if: github.repository == 'pagefaultgames/pokerogue'
    name: Generate Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          sparse-checkout: |
            pnpm-lock.yaml
            .github/scripts/changelog-reader
          sparse-checkout-cone-mode: false

      - uses: $/.github/actions/install-pnpm

      - name: Install dependencies
        run: pnpm add chalk octokit

      - name: Generate Changelog
        run: node .github/scripts/changelog-reader/main.mts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.label }}
